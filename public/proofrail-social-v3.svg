<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ProofRail pre-publication review</title>
  <desc id="desc">A warm editorial composition showing ProofRail beside a clean launch-page preview and a locked human publication gate.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="0.72" stop-color="#edf0ff"/>
      <stop offset="1" stop-color="#dbe1ff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#0b1327" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0b1327" flood-opacity=".2"/>
    </filter>
    <clipPath id="previewClip">
      <rect x="626" y="105" width="520" height="470" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0b1327">
    <circle cx="58" cy="50" r="18" fill="#3157ff"/>
    <text x="58" y="54" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">PR:</text>
    <text x="86" y="58" font-size="24" font-weight="800" letter-spacing="-1">ProofRail</text>
    <text x="43" y="120" fill="#626b7b" font-size="11" font-weight="700" letter-spacing="1.7">PRE-PUBLICATION WORKSPACE / MARKETING + PR</text>
    <line x1="43" y1="96" x2="77" y2="96" stroke="#3157ff" stroke-width="3"/>

    <text x="42" y="212" font-size="72" font-weight="700" letter-spacing="-5">Your page.</text>
    <text x="42" y="282" font-size="72" font-weight="700" letter-spacing="-5">Every claim.</text>
    <text x="42" y="350" fill="#3157ff" font-family="Georgia, Times New Roman, serif" font-size="60" font-style="italic" letter-spacing="-3">One human gate.</text>

    <text x="44" y="417" fill="#505a6b" font-size="19">AI checks every factual sentence against source evidence.</text>
    <text x="44" y="447" fill="#505a6b" font-size="19">A human makes the final call. Until then, publish stays locked.</text>

    <g font-size="10" font-weight="800" letter-spacing="1.1">
      <text x="44" y="560">DRAFT IN</text>
      <text x="130" y="560" fill="#9399a4">→</text>
      <text x="158" y="560">REAL PAGE PREVIEW</text>
      <text x="292" y="560" fill="#9399a4">→</text>
      <text x="320" y="560">EVIDENCE</text>
      <text x="390" y="560" fill="#9399a4">→</text>
      <text x="418" y="560" fill="#3157ff">HUMAN RELEASE</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="606" y="84" width="560" height="512" rx="22" fill="#0b1327"/>
    <path d="M606 150H1166" stroke="#263049"/>
    <path d="M606 204H1166" stroke="#263049"/>
    <text x="630" y="112" fill="#8893a9" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">THE PAGE YOUR AUDIENCE WOULD SEE</text>
    <text x="630" y="134" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Northstar launch brief · live layout</text>
    <circle cx="1032" cy="119" r="13" fill="none" stroke="#ff7768"/>
    <text x="1032" y="123" fill="#ff7768" font-family="Arial" font-size="13" text-anchor="middle">×</text>
    <text x="1054" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Publish locked</text>
    <text x="1054" y="132" fill="#8791a5" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="1">2 BLOCKERS</text>

    <text x="630" y="183" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="1">LAUNCH</text>
    <text x="715" y="183" fill="#737d91" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PROJECT</text>
    <text x="810" y="183" fill="#737d91" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1">BLOG</text>
    <text x="875" y="183" fill="#737d91" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1">REPORT</text>
    <rect x="1005" y="158" width="137" height="34" rx="17" fill="#f7f5ef"/>
    <text x="1073" y="179" fill="#0b1327" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing=".8">PUBLIC PAGE</text>

    <g clip-path="url(#previewClip)">
      <rect x="626" y="218" width="520" height="357" fill="#f7f4e9"/>
      <path d="M626 272H1146" stroke="#0b1327" stroke-opacity=".13"/>
      <text x="650" y="252" fill="#0b1327" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">Northstar</text>
      <rect x="1036" y="232" width="86" height="25" rx="13" fill="#0b1327"/>
      <text x="1079" y="248" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="800" text-anchor="middle" letter-spacing=".7">REQUEST ACCESS</text>
      <text x="650" y="324" fill="#747b88" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="800" letter-spacing="1.4">INTRODUCING / AUGUST 27, 2026</text>
      <text x="650" y="377" fill="#0b1327" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="750" letter-spacing="-2.4">Northstar reduces</text>
      <text x="650" y="424" fill="#0b1327" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="750" letter-spacing="-2.4">launch handoff</text>
      <text x="650" y="471" fill="#0b1327" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="750" letter-spacing="-2.4">time by 42%.</text>
      <text x="650" y="514" fill="#5b6474" font-family="Arial, Helvetica, sans-serif" font-size="13">Every factual sentence traces back to its source.</text>
      <path d="M968 292L1146 292V575H830L968 460Z" fill="#dfe4ff"/>
      <path d="M1085 292H1120V472L955 575H872L1085 430Z" fill="#caff52"/>
      <path d="M1146 372V575H927L1146 477Z" fill="#3157ff"/>
      <text x="1002" y="375" fill="#0b1327" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">N</text>
    </g>
  </g>
</svg>
